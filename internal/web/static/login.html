<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — PAT Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:          #0A0E1A;
      --bg-card:     #111827;
      --bg-elevated: #162030;
      --border:      #1E2D4A;
      --border-light:#243558;
      --text:        #F0F4FF;
      --text-secondary: #8B9DC3;
      --text-muted:  #4A5A80;
      --accent:      #2D7FF9;
      --accent-hover:#4D9BFF;
      --accent-glow: rgba(45, 127, 249, 0.2);
      --danger:      #FF4560;
      --danger-bg:   rgba(255, 69, 96, 0.1);
      --radius:      6px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtle grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(45,127,249,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(45,127,249,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .login-wrap {
      width: 100%;
      max-width: 400px;
      padding: 24px;
      position: relative;
      z-index: 1;
    }

    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px 36px;
      box-shadow: 0 32px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(45,127,249,0.05);
    }

    .login-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .login-logo-text .app-name {
      display: block;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .login-logo-text .app-sub {
      display: block;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 32px;
      line-height: 1.5;
    }

    .field { margin-bottom: 18px; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 7px;
      letter-spacing: 0.01em;
    }

    input {
      display: block;
      width: 100%;
      height: 42px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
      background: rgba(45,127,249,0.04);
    }

    input[readonly] {
      color: var(--text-muted);
      background: rgba(255,255,255,0.02);
      cursor: default;
    }

    input::placeholder { color: var(--text-muted); }

    input[type="password"] {
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.05em;
    }

    .btn-login {
      display: block;
      width: 100%;
      height: 42px;
      margin-top: 28px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, box-shadow 0.15s, opacity 0.15s;
      letter-spacing: 0.01em;
    }

    .btn-login:hover {
      background: var(--accent-hover);
      box-shadow: 0 4px 20px rgba(45,127,249,0.4);
    }

    .btn-login:active { opacity: 0.9; }
    .btn-login:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }

    .error-msg {
      display: none;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
      padding: 11px 14px;
      background: var(--danger-bg);
      border: 1px solid rgba(255,69,96,0.25);
      border-radius: var(--radius);
      font-size: 13px;
      color: var(--danger);
    }

    .error-msg.visible { display: flex; }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 28px 0;
    }

    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">

      <div class="login-logo">
        <svg width="36" height="36" viewBox="0 0 32 32" fill="none">
          <rect width="32" height="32" rx="8" fill="#2D7FF9" fill-opacity="0.15"/>
          <path d="M16 8L8 12V20L16 24L24 20V12L16 8Z" stroke="#2D7FF9" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M16 8V24M8 12L24 20M24 12L8 20" stroke="#2D7FF9" stroke-width="1.5" opacity="0.4"/>
        </svg>
        <div class="login-logo-text">
          <span class="app-name">PAT Monitor</span>
          <span class="app-sub">GitHub Credential Governance</span>
        </div>
      </div>

      <h1>Sign in</h1>
      <p class="subtitle">Enter your credentials to access the dashboard.</p>

      <form id="login-form" autocomplete="on" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            value="admin"
            readonly
            autocomplete="username"
          >
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
        </div>

        <button type="submit" class="btn-login" id="submit-btn">Sign in</button>

        <div class="error-msg" id="error-msg">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
            <path d="M8 2L2 13h12L8 2z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M8 7v3M8 11.5v.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span id="error-text">Invalid credentials</span>
        </div>
      </form>

    </div>
    <div class="login-footer">PAT Monitor · Scapia Security</div>
  </div>

  <script>
    document.getElementById('password').focus();

    var form = document.getElementById('login-form');
    var btn  = document.getElementById('submit-btn');
    var errEl = document.getElementById('error-msg');
    var errTx = document.getElementById('error-text');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      var password = document.getElementById('password').value.trim();
      if (!password) return;

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Signing in…';
      errEl.classList.remove('visible');

      fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: 'admin', password: password })
      }).then(function(resp) {
        if (resp.ok) {
          window.location.href = '/';
        } else {
          return resp.json().then(function(data) {
            errTx.textContent = data.error || 'Invalid credentials. Please try again.';
            errEl.classList.add('visible');
          }).catch(function() {
            errTx.textContent = 'Invalid credentials. Please try again.';
            errEl.classList.add('visible');
          });
        }
      }).catch(function() {
        errTx.textContent = 'Connection error. Please try again.';
        errEl.classList.add('visible');
      }).finally(function() {
        btn.disabled = false;
        btn.textContent = 'Sign in';
      });
    });
  </script>
</body>
</html>
