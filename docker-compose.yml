services:

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE:      patmonitor
      MYSQL_USER:          patmonitor
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-upatmonitor", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pat-monitor:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8005:8005"
    env_file:
      - .env
    environment:
      DATABASE_URL: patmonitor:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@tcp(mysql:3306)/patmonitor?parseTime=true&loc=UTC&charset=utf8mb4
    volumes:
      - ./policy.yaml:/app/policy.yaml:ro
      - ./pat-test.pem:/app/private-key.pem:ro
    command:
      - serve
      - --addr=0.0.0.0
      - --port=8005
      - --scan-interval=30m
      - --policy=/app/policy.yaml
      - --auto-migrate=true

volumes:
  mysqldata:
